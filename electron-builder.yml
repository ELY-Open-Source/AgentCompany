appId: com.agentcompany.desktop
productName: AgentCompany
directories:
  buildResources: assets
  output: build/release
files:
  - out/**
  - package.json
  - assets/icon.png
  - assets/tray-icon*.png
asar: true
icon: assets/icon.png
extraResources:
  - from: builtin-skills
    to: builtin-skills
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/.git/**"
      - "!**/node_modules/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.pytest_cache/**"
      - "!**/*.log"

mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

linux:
  icon: assets/icon.png
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  category: Development

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
