appId: com.agentcompany.desktop
productName: AgentCompany
directories:
  buildResources: assets
  output: build/release
files:
  - out/**
  - package.json
asar: true
icon: assets/icon.png
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
win:
  icon: assets/icon.ico
  target:
    - nsis
linux:
  icon: assets/icon.png
  target:
    - AppImage
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: generic
  url: ${AGENTCOMPANY_UPDATE_URL:-https://updates.example.invalid/agentcompany}
