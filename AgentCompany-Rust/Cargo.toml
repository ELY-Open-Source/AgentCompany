[workspace]
members = [
  "crates/support",
  "crates/domain",
  "crates/storage",
  "crates/pi_bridge",
  "crates/runtime",
  "crates/app_models",
  "crates/app_ui",
  "crates/app",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
gpui = "0.2.2"
parking_lot = "0.12.5"
rusqlite = { version = "0.37.0", features = ["bundled", "serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = "1.15.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
unicode-segmentation = "1.12.0"

app_models = { path = "crates/app_models" }
app_ui = { path = "crates/app_ui" }
domain = { path = "crates/domain" }
pi_bridge = { path = "crates/pi_bridge" }
runtime = { path = "crates/runtime" }
storage = { path = "crates/storage" }
support = { path = "crates/support" }
